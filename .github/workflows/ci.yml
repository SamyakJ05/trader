# Tests on every push. Nothing is built or published until these pass.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so no image is published whose tests did not pass.
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest

    # The integration tests (concurrent fills, settlement, ledger invariants)
    # SKIP without a database, and they cover the code most likely to corrupt
    # money. A real Postgres here is what stops a green tick meaning less than
    # it looks like it means.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install uv
          uv pip install --system ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Migrate the test database
        env:
          DATABASE_URL: postgresql+asyncpg://trader:trader@localhost:5432/trader_test
        run: alembic upgrade head

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://trader:trader@localhost:5432/trader_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

      - name: The live gate must still be armed
        # A non-paper adapter marked WORKING means someone verified it against
        # a real broker — or did not, and flipped it anyway. Either way it is
        # not something a build should carry silently.
        #
        # VERIFIED_LIVE_ADAPTERS is the record of the ones that were, carrying
        # what was verified and when. An adapter flipped without being added
        # there still fails this build, which is the whole point; adding it is
        # a diff someone has to write and review.
        run: |
          python -c "
          from app.domain.capabilities import CAPABILITY_MATRIX, VERIFIED_LIVE_ADAPTERS
          unverified = [b.value for b, c in CAPABILITY_MATRIX.items()
                        if c.adapter_status.value == 'working'
                        and b.value != 'paper'
                        and b not in VERIFIED_LIVE_ADAPTERS]
          if unverified:
              raise SystemExit(f'adapters marked working without a verification record: {unverified}')
          # The converse: a recorded adapter that is NOT working means the
          # record outlived the thing it describes, and would read as a
          # verification that no longer applies.
          stale = [b.value for b in VERIFIED_LIVE_ADAPTERS
                   if CAPABILITY_MATRIX[b].adapter_status.value != 'working']
          if stale:
              raise SystemExit(f'listed as verified but not working: {stale}')
          print('live gate armed; verified:', sorted(b.value for b in VERIFIED_LIVE_ADAPTERS))
          "

  web:
    runs-on: ubuntu-latest
    # The workspace root is the repo root (pnpm-workspace.yaml lives there),
    # not apps/web -- installing from apps/web still resolves the root
    # lockfile, so the cache key and --frozen-lockfile check must agree on
    # that same file or the install fails before any test runs.
    steps:
      - uses: actions/checkout@v4
      # No version: here -- package.json's packageManager field already
      # pins pnpm@9.15.4, and the action refuses to run if both are set
      # ("Multiple versions of pnpm specified"), which is what failed here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web exec vitest run
