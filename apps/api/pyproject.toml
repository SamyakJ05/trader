[project]
name = "trader-api"
version = "0.1.0"
description = "Broker-agnostic algorithmic trading platform (India) — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "email-validator>=1.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
    "structlog>=24.4",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "greenlet>=3.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyotp>=2.9",
    # Zerodha's own SDK. Used for the Kite WebSocket tick protocol, which is a
    # binary format we would otherwise have to parse ourselves. It brings
    # Twisted with it; the reactor is confined to the Zerodha adapter and runs
    # on its own thread so it never touches the asyncio loop the app runs on.
    "kiteconnect>=5.0",
    # ICICI Breeze streams over socket.io. Unlike Kite's SDK this has a native
    # asyncio client, so it needs no thread bridge — the connection lives on
    # the same loop as everything else.
    "python-socketio[asyncio_client]>=5.11",
]

[project.optional-dependencies]
history = ["yfinance>=0.2.54,<2"]
# fakeredis needs its lua extra: the throttle's token bucket is a Lua script,
# and without it EVALSHA is unsupported and every rate-limit test errors.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "fakeredis[lua]>=2.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
