# Base service definitions shared by dev and prod. Deliberately has no bind
# mounts, no working_dir, no dev commands: Compose merges volumes/working_dir
# by matching a value here, replacing it, or leaving it in place if the
# overlay is silent -- an empty list or omitted key in an overlay does NOT
# clear something set here (confirmed the hard way: a bind mount and a
# working_dir set here both survived into the prod overlay silently, because
# `volumes: []` and no working_dir: override look like "nothing to say" to
# Compose's merge, not "remove what the base file set"). So the base file
# says nothing dev-specific, and docker-compose.dev.yml adds it back.
#
#   Local dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml <cmd>
#   Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: ${POSTGRES_DB:-trader}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader}@db:5432/${POSTGRES_DB:-trader}
      REDIS_URL: redis://redis:6379/0
    # db: required: false -- the prod overlay disables db entirely (managed
    # Postgres instead) via profiles: ["never"], which removes it from the
    # merged project. depends_on entries merge per-key across -f files rather
    # than being replaced wholesale, so a hard dependency here would survive
    # into prod as a reference to a service that no longer exists and fail
    # to start. Soft here means: wait for it in dev, where it is running;
    # warn and continue in prod, where DATABASE_URL points elsewhere anyway.
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: arq app.workers.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader}@db:5432/${POSTGRES_DB:-trader}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  web:
    build: ./apps/web

volumes:
  pgdata:
